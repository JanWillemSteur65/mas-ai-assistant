apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: mas-assistant
  namespace: mas-salmai-assistant
spec:
  source:
    type: Git
    git:
      uri: https://github.com/JanWillemSteur65/mas-ai-assistant
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: mas-assistant:latest
  triggers:
    - type: ConfigChange
